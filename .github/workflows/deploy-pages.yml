name: Deploy VELLORA to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: vellora-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out website
        uses: actions/checkout@v4

      - name: Prepare static website
        run: |
          mkdir -p dist/web
          cp index.html dist/index.html
          cp web/styles.css web/app.js dist/web/

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload website files
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Publish VELLORA
        id: deployment
        uses: actions/deploy-pages@v4
