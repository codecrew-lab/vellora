<!DOCTYPE html>
<html lang="en" data-theme="manuscript"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VELLORA — Admin</title><link rel="stylesheet" href="admin.css"><style>
body{min-height:100vh}.admin-wrap{max-width:760px;margin:60px auto;padding:24px}.admin-card{background:var(--surface);border:1px solid var(--border);padding:28px;border-radius:10px;box-shadow:0 12px 36px #0001}.admin-card h1{font:600 2.4rem var(--display);margin-bottom:6px}.admin-card p{color:var(--text2);margin-bottom:18px}.admin-form{display:grid;gap:14px}.admin-form label{display:grid;gap:6px;font-family:var(--ui);font-size:.9rem}.admin-form input,.admin-form textarea{width:100%;padding:11px 12px;border:1px solid var(--border);border-radius:6px;background:var(--bg);color:var(--text);font:inherit}.admin-form textarea{min-height:100px}.admin-form .btn{width:max-content;border:0}.admin-status{padding:12px;border-radius:6px;background:var(--bg);color:var(--text2);margin:14px 0}.admin-status.error{color:#a33}.admin-status.success{color:#28633d}.admin-hidden{display:none!important}.admin-top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}.admin-top button{border:1px solid var(--border);padding:8px 12px;border-radius:6px}.admin-note{font-size:.85rem}
</style></head>
<body><main class="admin-wrap"><div class="admin-card"><div class="admin-top"><span class="logo">VELLORA</span><a href="index.html">← View library</a></div>
<section id="loginPanel"><h1>Admin access</h1><p>Enter your VELLORA login code and your private Supabase access code.</p><form id="loginForm" class="admin-form"><label>Login code<input name="loginCode" type="password" inputmode="numeric" autocomplete="off" required maxlength="32"></label><label>Secret access code<input name="secretCode" type="password" autocomplete="off" required maxlength="256"></label><button class="btn" type="submit">Unlock Admin Hub</button></form><div id="loginStatus" class="admin-status" role="status" aria-live="polite"></div></section>
<section id="dashboard" class="admin-hidden"><div class="admin-top"><div><h1>Add a book</h1><p class="admin-note">The admin hub is add-only. Books cannot be edited or deleted here.</p></div><button id="signOut" type="button">Lock Admin Hub</button></div>
<form id="bookForm" class="admin-form"><label>Book title<input name="title" required maxlength="180"></label><label>Author<input name="author" required maxlength="160"></label><label>Genre<input name="genre" required maxlength="80" placeholder="Fantasy, Mystery, Romance…"></label><label>Language<input name="language" value="English" required maxlength="80"></label><label>Description<textarea name="description" maxlength="3000"></textarea></label><label>Estimated reading time (minutes)<input name="reading_time_minutes" type="number" min="1" max="100000"></label><label>Cover image<input name="cover" type="file" accept="image/jpeg,image/png,image/webp" required></label><label>Book PDF<input name="pdf" type="file" accept="application/pdf" required></label><label><span><input name="is_featured" type="checkbox"> Feature on homepage</span></label><label><span><input name="is_recommended" type="checkbox"> Mark as recommended</span></label><label><span><input name="is_published" type="checkbox"> Publish immediately</span></label><button class="btn" type="submit">Add book to VELLORA</button></form><div id="adminStatus" class="admin-status" role="status" aria-live="polite">Only published books appear in the public library.</div></section></div></main><script src="admin.js"></script></body></html>
