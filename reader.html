<!DOCTYPE html>

<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>VELLORA – Reader</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Lora:ital,wght@0,400;0,500;1,400&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--display:'Cormorant Garamond',Georgia,serif;--body:'Lora',Georgia,serif;--ui:'DM Sans',system-ui,sans-serif;--fs:18px}
[data-theme=manuscript]{--bg:#EDE3D0;--surface:#F6EEDC;--text:#45372B;--text2:#776653;--accent:#A98A59;--border:#C9B99D}
[data-theme=vellum]{--bg:#FAF7F2;--surface:#FFFCF7;--text:#453A31;--text2:#827568;--accent:#B49A73;--border:#E6DED2}
[data-theme=heritage]{--bg:#211A16;--surface:#2D231C;--text:#E5D5BE;--text2:#B6A28A;--accent:#B18A55;--border:#514031}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:var(--body);overflow:hidden;transition:background .4s}
button,select{font:inherit;color:inherit;cursor:pointer;background:none;border:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ui{font-family:var(--ui);font-size:.88rem}
#top{position:fixed;top:0;left:0;right:0;height:56px;display:flex;align-items:center;gap:6px;padding:0 14px;z-index:20}
#top a,#top button,#top select{padding:6px 11px;border:1px solid var(--border);border-radius:6px;background:var(--surface);color:var(--text);text-decoration:none;white-space:nowrap}
#top .sp{flex:1;text-align:center;font-family:var(--display);font-size:1.15rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#top option{color:#000}
#prog{position:fixed;top:56px;left:0;height:3px;width:0;background:var(--accent);z-index:20;transition:width .4s}
.stage{position:fixed;inset:60px 0 54px;display:flex;align-items:center;justify-content:center}
.book{position:relative;display:flex;perspective:2200px;filter:drop-shadow(0 20px 30px rgba(0,0,0,.3))}
.pg{position:relative;width:min(440px,calc(100vw - 28px));height:min(640px,calc(100dvh - 130px));background:var(--surface);color:var(--text);padding:36px 38px 52px;overflow:hidden;font-size:var(--fs);line-height:1.7;font-family:var(--body);
background-image:radial-gradient(rgba(120,95,60,.1) 1px,transparent 1px);background-size:5px 5px;border:1px solid var(--border)}
.book.two .pg:first-child{border-radius:6px 0 0 6px;box-shadow:inset -22px 0 24px -20px rgba(0,0,0,.28)}
.book.two .pg:last-child{border-radius:0 6px 6px 0;box-shadow:inset 22px 0 24px -20px rgba(0,0,0,.28)}
.book:not(.two) .pg{border-radius:6px}
.pg p{text-align:left;margin:0 0 .9em;hyphens:auto}
.pg p+p:not(.cont){text-indent:1.4em;margin-top:-.9em;padding-top:0}
.pg h2{font-family:var(--display);font-weight:600;font-size:1.7em;line-height:1.15;text-align:center;margin:.4em 0 .15em;color:var(--text)}
.pg .sub{font-family:var(--display);font-style:italic;text-align:center;color:var(--text2);margin-bottom:.4em}
.pg .orn{text-align:center;color:var(--accent);margin:.2em 0 1.1em;letter-spacing:.5em}
.pg p.first::first-letter{font-family:var(--display);font-weight:700;float:left;font-size:3.3em;line-height:.8;padding:.08em .1em 0 0;color:var(--accent)}
.pg .wm{position:absolute;left:38px;bottom:16px;font-family:var(--display);letter-spacing:.3em;font-size:.62rem;color:var(--text2);opacity:.35}
.pg .pn{position:absolute;right:38px;bottom:15px;font-family:var(--ui);font-size:.72rem;color:var(--text2)}
.rb{position:absolute;top:0;right:26px;width:28px;height:68px;padding:0;transform-origin:bottom center;z-index:4;filter:drop-shadow(0 5px 5px rgba(0,0,0,.28));transition:filter .25s}
.rb svg{display:block;width:28px;height:68px;overflow:visible}
.rb.off{height:24px;overflow:hidden;opacity:.42;filter:drop-shadow(0 2px 2px rgba(0,0,0,.2))}.rb.off svg{height:68px}.rb.off:hover{opacity:.8}
.rb.on{animation:bookmark-rise .78s cubic-bezier(.2,1.35,.35,1) both}
.rb.on:hover{filter:drop-shadow(0 7px 7px rgba(0,0,0,.34))}
@keyframes bookmark-rise{0%{opacity:0;transform:translateY(20px) scaleY(.22);clip-path:inset(100% 0 0 0)}55%{opacity:1;transform:translateY(-3px) scaleY(1.04);clip-path:inset(0)}76%{transform:translateY(2px) scaleY(.98)}100%{opacity:1;transform:translateY(0) scaleY(1);clip-path:inset(0)}}
#nav{position:fixed;bottom:0;left:0;right:0;height:54px;display:flex;align-items:center;justify-content:center;gap:18px;z-index:20;color:var(--text2)}
#nav button{padding:6px 16px;border:1px solid var(--border);border-radius:6px;background:var(--surface);color:var(--text)}
#nav button:disabled{opacity:.35}
.probe{position:absolute;visibility:hidden;left:-9999px;top:0}
#print{display:none}
@media(max-width:639px){.pg{padding:28px 24px 50px}.pg .wm{left:24px}.pg .pn{right:24px}#top .hide{display:none}}
@media print{
 @page{size:A5;margin:16mm 15mm 20mm;@bottom-center{content:counter(page);font-family:serif;font-size:9pt;color:#777}}
 html,body{height:auto;overflow:visible;background:var(--surface)!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
 #top,#prog,.stage,#nav,.probe{display:none!important}
 #print{display:block;color:var(--text);font-family:var(--body);font-size:11.5pt;line-height:1.65}
 #print .cov{height:170mm;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;border:1px solid var(--accent);page-break-after:always}
 #print .cov h1{font-family:var(--display);font-size:30pt;margin:0 14mm}#print .cov small{color:var(--text2);margin-top:6mm;letter-spacing:.3em}
 #print h2{font-family:var(--display);font-size:20pt;text-align:center;page-break-before:always;margin:0 0 2mm}
 #print .cov+h2,#print h2:first-of-type{page-break-before:auto}
 #print .sub{text-align:center;font-style:italic;color:var(--text2)}
 #print .orn{text-align:center;color:var(--accent);letter-spacing:.5em;margin-bottom:6mm}
 #print p{margin:0 0 3mm;text-align:justify;orphans:3;widows:3;color:var(--text)}
 #print p.first::first-letter{font-family:var(--display);font-weight:700;float:left;font-size:3em;line-height:.8;padding-right:2mm;color:var(--accent)}
 #print .wmf{position:fixed;bottom:-12mm;left:0;font-family:var(--display);letter-spacing:.3em;font-size:7pt;color:var(--text2);opacity:.5}
}
.page-search{padding:10px 12px;border-top:1px solid var(--border);display:grid;gap:8px}.page-search label{font-size:.78rem;color:var(--text2)}.page-search>div{display:flex;gap:8px}.page-search input{min-width:0;width:100%;padding:9px 10px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);font:inherit}.page-search button{border:1px solid var(--border);border-radius:8px;padding:8px 14px;background:var(--surface);white-space:nowrap}.page-search small{min-height:1em;color:var(--text2);font-size:.72rem}
#contentsPanel{position:fixed;inset:0;z-index:80;background:rgba(12,8,5,.55);display:none;align-items:stretch;justify-content:flex-end;font-family:var(--ui)}#contentsPanel.show{display:flex}#contentsPanel .contents-card{width:min(430px,100%);height:100%;overflow:auto;background:var(--surface);color:var(--text);border-left:1px solid var(--border);box-shadow:-20px 0 60px rgba(0,0,0,.3);padding:24px clamp(16px,4vw,30px)}.contents-head{display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:1px solid var(--border);padding-bottom:16px;margin-bottom:16px}.contents-head h2{font:600 1.8rem var(--display)}.contents-head button{border:1px solid var(--border);border-radius:999px;padding:8px 12px}.contents-subtitle{font-size:.72rem;color:var(--text2);line-height:1.6;margin-bottom:16px}.contents-list{display:grid;gap:5px}.contents-part{padding:12px 8px 5px;color:var(--accent);font-size:.72rem;letter-spacing:.1em;text-transform:uppercase}.contents-part-entry{font-weight:700;color:var(--accent);border-top:1px solid var(--border);margin-top:8px;padding-top:14px}.contents-entry{width:100%;display:flex;align-items:center;justify-content:space-between;gap:12px;text-align:left;padding:10px 9px;border-radius:8px;font:500 .86rem var(--ui);color:var(--text)}.contents-entry:hover{background:var(--bg)}.contents-chapter-entry{padding-left:24px}.contents-entry span:first-child{min-width:0;overflow-wrap:anywhere}.contents-page{flex:none;color:var(--accent);font-variant-numeric:tabular-nums}.contents-empty{color:var(--text2);font-size:.85rem;padding:12px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ===== PREMIUM LAYER ===== */
::selection{background:var(--accent);color:#211A16}
body::before{content:"";position:fixed;inset:0;pointer-events:none;background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .35  0 0 0 0 .27  0 0 0 0 .17  0 0 0 .55 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");opacity:.5;mix-blend-mode:multiply;background-size:160px}
[data-theme=heritage] body::before{mix-blend-mode:screen;opacity:.15}
body::after{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 40%,transparent 35%,rgba(30,18,8,.28) 100%)}
[data-theme=heritage] body::after{background:radial-gradient(ellipse at 50% 40%,rgba(177,138,85,.07),rgba(0,0,0,.6) 100%)}
#top{backdrop-filter:blur(14px);background:linear-gradient(var(--bg),transparent);}
#top a,#top button,#top select{backdrop-filter:blur(8px);transition:border-color .2s,transform .2s}
#top a:hover,#top button:hover,#top select:hover{border-color:var(--accent);transform:translateY(-1px)}
#top .sp{font-size:1.3rem;letter-spacing:.02em}
#prog{height:2px;background:linear-gradient(90deg,#a77d3e,#f3dfa8,#a77d3e);box-shadow:0 0 12px rgba(217,182,115,.6)}
.book{filter:drop-shadow(0 40px 50px rgba(20,10,0,.45)) drop-shadow(0 6px 8px rgba(20,10,0,.25))}
.pg{background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .35  0 0 0 0 .27  0 0 0 0 .17  0 0 0 .55 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"),linear-gradient(var(--surface),var(--surface));background-size:160px,auto;background-blend-mode:multiply;border-color:var(--border)}
[data-theme=heritage] .pg{background-blend-mode:screen}
.pg::before{content:"";position:absolute;inset:14px;border:1px solid var(--border);border-radius:2px;pointer-events:none;opacity:.8}
.pg::after{content:"";position:absolute;inset:18px;border:1px solid var(--border);opacity:.35;pointer-events:none}
.book.two .pg:first-child{box-shadow:inset -34px 0 30px -26px rgba(0,0,0,.4),-1px 0 0 var(--border),-2px 0 0 var(--surface),-3px 0 0 var(--border),-4px 1px 0 var(--surface),-5px 1px 0 var(--border)}
.book.two .pg:last-child{box-shadow:inset 34px 0 30px -26px rgba(0,0,0,.4),1px 0 0 var(--border),2px 0 0 var(--surface),3px 0 0 var(--border),4px 1px 0 var(--surface),5px 1px 0 var(--border)}
.book:not(.two) .pg{box-shadow:1px 0 0 var(--border),2px 0 0 var(--surface),3px 0 0 var(--border),4px 1px 0 var(--surface),5px 1px 0 var(--border)}
.pg h2{background:linear-gradient(180deg,var(--text),var(--accent));-webkit-background-clip:text;background-clip:text;color:transparent;font-size:1.9em}
.pg .sub{letter-spacing:.2em;text-transform:uppercase;font-family:var(--ui);font-style:normal;font-size:.5em}
.pg .orn{font-size:1.1em}
.pg p.first::first-letter{background:linear-gradient(180deg,#e6c780,#a77d3e);-webkit-background-clip:text;background-clip:text;color:transparent;font-size:3.7em;padding-right:.12em}
.rb{filter:drop-shadow(0 4px 4px rgba(0,0,0,.4));z-index:3}
.pg .wm{opacity:.45;z-index:3}.pg .pn{z-index:3}
.pg>div:first-child{position:relative;z-index:2}
#nav button{backdrop-filter:blur(8px);transition:border-color .2s,transform .2s;letter-spacing:.04em}
#nav button:not(:disabled):hover{border-color:var(--accent);transform:translateY(-1px)}
#pl{letter-spacing:.08em;font-size:.8rem}

/* ===== FINAL LAYER: matches the new library ===== */
#top{height:62px;gap:12px;padding:0 clamp(14px,3vw,36px);background:color-mix(in srgb,var(--bg) 78%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid color-mix(in srgb,var(--border) 70%,transparent)}
#top a,#top button{border:0;background:none;border-radius:999px;font-size:.72rem;letter-spacing:.16em;text-transform:uppercase;padding:10px 14px;transition:.25s;color:var(--text)}
#top a:hover,#top button:hover,#top button[aria-expanded=true]{background:var(--surface);color:var(--accent)}
#top .ic{padding:10px;display:grid;place-items:center}
.rtools{display:flex;align-items:center;gap:2px}
#top .sp{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;line-height:1.15;border:0;background:none;padding:0}
#top .sp small{font-family:var(--display);font-weight:700;letter-spacing:.42em;font-size:.62rem;padding-left:.42em;background:linear-gradient(180deg,#f8ebc8 0%,#d9b673 45%,#a77d3e 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
#top .sp #ttl{font-family:var(--display);font-size:1.15rem;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#prog{top:62px;height:2px;background:linear-gradient(90deg,#a77d3e,#f8ebc8)}
.stage{inset:66px 0 58px}
.pg::after{content:"";position:absolute;inset:12px;border:1px solid color-mix(in srgb,var(--accent) 30%,transparent);pointer-events:none}
#nav{height:58px;gap:22px;font-family:var(--ui);font-size:.72rem;letter-spacing:.2em;text-transform:uppercase}
#nav button{padding:10px 24px;border:1px solid var(--border);border-radius:999px;background:transparent;font-size:.72rem;letter-spacing:.16em;text-transform:uppercase;transition:.25s}
#nav button:hover:not(:disabled){border-color:var(--accent);color:var(--accent)}
#nav #nx{background:linear-gradient(180deg,#f8ebc8 0%,#d9b673 45%,#a77d3e 100%);color:#2a1d0c;border-color:transparent;box-shadow:0 6px 16px rgba(120,85,30,.3)}
#nav #nx:hover:not(:disabled){color:#2a1d0c;filter:brightness(1.06)}
#nav #nx:disabled{background:transparent;color:var(--text);border-color:var(--border);box-shadow:none}
#panel{position:fixed;top:72px;right:clamp(12px,3vw,32px);z-index:50;width:min(320px,calc(100vw - 24px));padding:10px;background:color-mix(in srgb,var(--surface) 88%,transparent);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid var(--border);border-radius:16px;box-shadow:0 30px 70px rgba(0,0,0,.35);transform-origin:top right;transform:scale(.92) translateY(-8px);opacity:0;pointer-events:none;transition:.25s;font-family:var(--ui)}
#panel.show{transform:none;opacity:1;pointer-events:auto}
#panel h2{font-family:var(--display);font-size:1.5rem;padding:8px 12px 2px}
#panel .subt{padding:0 12px 6px;color:var(--text2);font-size:.85rem}
.themes{display:grid;gap:8px;padding:8px 4px}
.th{display:flex;gap:12px;align-items:center;padding:10px 12px;border:1px solid var(--border);border-radius:10px;text-align:left;font-size:.92rem;width:100%}
.th[aria-pressed=true]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.th b{display:block;font-weight:500}.th small{color:var(--text2)}
.sw{width:30px;height:30px;border-radius:50%;border:1px solid var(--border);flex:none}
.mi{display:block;width:100%;text-align:left;padding:12px;border-radius:8px;font-size:.95rem;transition:background .2s,padding-left .2s}
.mi:hover{background:var(--bg);padding-left:18px}
#panel .themes+.mi{margin-top:6px;border-top:1px solid var(--border);border-radius:0 0 8px 8px}
@media(max-width:639px){#top .back{padding:10px 8px;letter-spacing:.08em}#top .sp small{display:none}.stage{inset:64px 0 56px}}
@media print{#panel{display:none!important}}
.preview-flag{font:600 .58rem var(--ui);letter-spacing:.13em;color:var(--accent);border:1px solid var(--border);border-radius:999px;padding:6px 9px;white-space:nowrap}@media(max-width:639px){.preview-flag{font-size:.5rem;padding:5px 6px;letter-spacing:.06em}}
</style>
</head>
<body>
<div id="top" class="ui">
  <a class="back" href="index.html">&#8249; Library</a>
  <div class="sp"><small>VELLORA</small><span id="ttl"></span></div>
  <div class="rtools">
    <button id="am" aria-label="Smaller text">A-</button><button id="ap" aria-label="Larger text">A+</button>
    <button id="rj" class="hide">Ribbon</button>
    <button id="gear" class="ic" aria-label="Settings" aria-expanded="false" aria-controls="panel"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></svg></button>
  </div>
</div>

    <button class="th" data-theme-pick="manuscript"><span class="sw" style="background:#EDE3D0"></span><span><b>Enhanced Manuscript</b><small>Faded manuscript</small></span></button>
    <button class="th" data-theme-pick="vellum"><span class="sw" style="background:#FFFCF7"></span><span><b>Classic Vellum</b><small>Warm ivory</small></span></button>

<script>if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js",{scope:"./"}).catch(e=>console.warn("VELLORA offline shell:",e)));}</script>
<script>
/* Live VELLORA stories are loaded from the published Supabase catalogue. */
const $=s=>document.querySelector(s);
const previewMode=new URLSearchParams(location.search).get("preview")==="1";
const previewMemory=Object.create(null);
const st={get(k,d){if(previewMode)return Object.prototype.hasOwnProperty.call(previewMemory,k)?previewMemory[k]:d;try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}},set(k,v){if(previewMode){previewMemory[k]=v;return}try{localStorage.setItem(k,JSON.stringify(v))}catch{}}};
const OFFLINE_DB="vellora-offline-library";
function offlineStory(storyId){return new Promise((resolve,reject)=>{if(!("indexedDB" in window)){resolve(null);return}const q=indexedDB.open(OFFLINE_DB,1);q.onupgradeneeded=()=>{if(!q.result.objectStoreNames.contains("books"))q.result.createObjectStore("books",{keyPath:"id"})};q.onsuccess=()=>{const d=q.result;try{const t=d.transaction("books","readonly"),g=t.objectStore("books").get(String(storyId));g.onsuccess=()=>{const v=g.result||null;d.close();resolve(v&&v._offline?v:null)};g.onerror=()=>{const e=g.error;d.close();reject(e)}}catch(e){d.close();reject(e)}};q.onerror=()=>reject(q.error)})}
let id=new URLSearchParams(location.search).get("id")||"";
let title="Loading story…",genre="VELLORA EDITIONS",author="VELLORA Editions",chapters=[];
$("#ttl").textContent=title;document.title="Loading story – VELLORA";
function safeText(value){return String(value??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;")}
function formatParagraph(value){return safeText(value).replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>").replace(/\*(.+?)\*/g,"<em>$1</em>").replace(/`(.+?)`/g,"<code>$1</code>")}
function parseManuscript(source){
  const lines=String(source||"").replace(/\r\n?/g,"\n").split("\n");
  const result=[];let current={h:"The Story",s:"",p:[]},paragraph=[],hasHeading=false,activePart="";
  const flushParagraph=()=>{const value=paragraph.join(" ").trim();if(value)current.p.push(formatParagraph(value));paragraph=[]};
  const flushChapter=()=>{flushParagraph();if(current.p.length||hasHeading)result.push(current);hasHeading=false};
  const addPart=name=>{
    const clean=String(name||"Part I").trim();
    flushChapter();
    if(activePart!==clean){
      current={h:safeText(clean),s:"Part",p:[]};hasHeading=true;flushChapter();activePart=clean;
    }else{
      current={h:"",s:"",p:[]};hasHeading=false;
    }
  };
  for(const raw of lines){
    const line=raw.trim();
    if(!line){flushParagraph();continue}
    const partLine=line.match(/^##\s+(Part\s+.+)$/i);
    const heading=line.match(/^#\s+(.+)$/);
    const section=line.match(/^##\s+(.+)$/);
    if(partLine){addPart(partLine[1]);continue}
    if(heading){
      const value=heading[1].trim();
      const combined=value.match(/^(Part\s+.+?)\s+[—-]\s+(.+)$/i);
      if(combined){addPart(combined[1]);current={h:safeText(combined[2].trim()),s:"Chapter",p:[]};hasHeading=true;continue}
      flushChapter();current={h:safeText(value),s:"Chapter",p:[]};hasHeading=true;continue;
    }
    if(section){flushChapter();current={h:safeText(section[1].trim()),s:"Section",p:[]};hasHeading=true;continue}
    paragraph.push(line);
  }
  flushChapter();
  return result.length?result:[{h:"The Story",s:"",p:[formatParagraph("This story has no manuscript text yet. Please contact the VELLORA editor.")] }];
}
function markRecent(){st.set("vellora.recent",[id,...st.get("vellora.recent",[]).filter(x=>String(x)!==String(id))].slice(0,12))}
function applyStoryData(data){title=data.title||"Untitled story";genre=data.genre||"VELLORA EDITIONS";author=data.author||"VELLORA Editions";chapters=parseManuscript(data.manuscript_content);$("#ttl").textContent=title+" · "+author;document.title=title+" – VELLORA";markRecent();pos=st.get("vellora.pos."+id,0);bm=st.get("vellora.bm."+id,null);return (document.fonts?document.fonts.ready:Promise.resolve()).then(()=>setup())}
async function loadStory(){
 try{
  if(!navigator.onLine){const cached=await offlineStory(id);if(cached&&String(cached.manuscript_content||"").trim()){await applyStoryData(cached);return}}
  const cfg=window.VELLORA_CONFIG||{};
  if(!id)throw new Error("No story was selected. Return to the Library and choose a story.");
  if(!window.supabase||!cfg.url||!cfg.publishableKey)throw new Error("The VELLORA library connection is unavailable.");
  const client=window.supabase.createClient(cfg.url,cfg.publishableKey);
  const {data,error}=await client.from("books").select("id,title,author,genre,manuscript_content,is_published").eq("id",id).eq("is_published",true).maybeSingle();
  if(error)throw error;
  if(!data)throw new Error("This story is unavailable or is no longer published.");
  if(!String(data.manuscript_content||"").trim())throw new Error("This story does not have manuscript text yet.");
  await applyStoryData(data);
 }catch(error){
  try{const cached=await offlineStory(id);if(cached&&String(cached.manuscript_content||"").trim()){await applyStoryData(cached);return}}catch(cacheError){console.warn("VELLORA offline story:",cacheError)}
  $("#ttl").textContent="Story unavailable";document.title="Story unavailable – VELLORA";$("#book").className="book";$("#book").innerHTML='<div class="pg" style="display:flex;flex-direction:column;justify-content:center;text-align:center"><h2>Unable to open this story</h2><p>'+safeText(error.message||"Please return to the Library and try again.")+'</p><p><a href="index.html">Return to VELLORA Library</a></p></div>';$("#pl").textContent="";$("#pv").disabled=true;$("#nx").disabled=true;console.error("VELLORA reader:",error);
 }
}

/* theme, font, sound */
const root=document.documentElement;
let fs=st.get("vellora.fs",18),sound=st.get("vellora.sound",true);
function applyPrefs(){root.dataset.theme=st.get("vellora.theme","manuscript");$("#th").value=root.dataset.theme;root.style.setProperty("--fs",fs+"px");$("#snd").textContent=sound?"Sound on":"Sound off";$("#snd").setAttribute("aria-pressed",sound)}
applyPrefs();

/* pagination: pages hold HTML and the index of their first word */
let pages=[],idx=0,two=false,bm=null,pos=0;
const probe=document.createElement("div");probe.className="pg probe";document.body.appendChild(probe);
const fits=h=>{probe.innerHTML=h;return probe.scrollHeight<=probe.clientHeight+1};
function paginate(){
  pages=[];let cur="",curW=0,w=0,curChapterIndex=0;
  const flush=()=>{if(cur)pages.push({h:cur,w:curW,chapterIndex:curChapterIndex});cur="";};
  chapters.forEach((c,chapterIndex)=>{
    flush();curChapterIndex=chapterIndex;curW=w;cur=`<h2>${c.h}</h2><div class="sub">${c.s||""}</div><div class="orn">&#10086;</div>`;
    c.p.forEach((para,pi)=>{
      const words=para.split(" ");let i=0,cont=false;
      while(i<words.length){
        const cls=()=>(pi===0&&!cont&&i===0?"first":cont?"cont":"");
        const mk=k=>`<p class="${cls()}">${words.slice(i,i+k).join(" ")}</p>`;
        let lo=0,hi=words.length-i;
        while(lo<hi){const m=Math.ceil((lo+hi)/2);fits(cur+mk(m))?lo=m:hi=m-1}
        if(lo===0){if(cur.includes("<p")){flush();curW=w;continue}lo=1}
        cur+=mk(lo);i+=lo;w+=lo;
        if(i<words.length){flush();curW=w;cont=true}
      }
    });
  });
  flush();
}
const pageIndexForWord=wd=>{let r=0;pages.forEach((p,i)=>{if(p.w<=wd)r=i});return r};

/* render */
const book=$("#book");
const RIB=`<svg width="28" height="68" viewBox="0 0 28 68" aria-hidden="true"><path d="M1 0h26v68L14 56 1 68z" fill="#641f24"/><path d="M3 0h20v58L14 49 5 58z" fill="#9e3d3d"/><path d="M5 0h5v57l-5 3z" fill="#c66b61" opacity=".72"/><path d="M22 0h3v59l-3-2z" fill="#43151a" opacity=".72"/><path d="M1 0h26v5H1z" fill="#4b171b"/><path d="M3 5h2v48H3z" fill="#e7b7a0" opacity=".3"/></svg>`;
function pageEl(n){
  const p=pages[n];if(!p)return`<div class="pg"></div>`;
  const nxt=pages[n+1]?pages[n+1].w:Infinity;
  const on=bm!==null&&bm>=p.w&&bm<nxt;
  return`<div class="pg" data-n="${n}"><div>${p.h}</div><span class="wm">VELLORA</span><span class="pn">${n+1}</span><button class="rb ${on?"on":"off"}" data-n="${n}" aria-label="${on?"Remove ribbon":"Place ribbon"}">${RIB}</button></div>`;
}
function render(){
  book.className="book"+(two?" two":"");
  book.innerHTML=pageEl(idx)+(two?pageEl(idx+1):"");
  const last=pages.length-1;
  const visibleEnd=Math.min(pages.length,idx+(two&&pages[idx+1]?2:1));
  const pct=Math.max(0,Math.min(100,Math.round((visibleEnd/pages.length)*100)));
  $("#pl").textContent=(two&&pages[idx+1]?"Pages "+(idx+1)+"-"+(idx+2):"Page "+(idx+1))+" of "+pages.length+" · "+pct+"%";
  $("#pv").disabled=idx<=0;$("#nx").disabled=idx+(two?2:1)>last;
  $("#prog").style.width=pct+"%";
  renderContentsIndex();
  pos=pages[idx].w;st.set("vellora.pos."+id,pos);
  st.set("vellora.progress."+id,{page:idx+1,totalPages:pages.length,percent:pct,wordPosition:pos,updatedAt:Date.now()});
}
function setup(){
  two=innerWidth>=900;paginate();
  idx=pageIndexForWord(pos);if(two)idx-=idx%2;render();
}

/* Dynamic contents index and page-number navigation use the exact current pagination. */
function renderContentsIndex(){
 const host=$("#contentsList");if(!host)return;host.innerHTML="";
 chapters.forEach((chapter,chapterIndex)=>{
  if(chapter.s==="Section")return;
  const pageIndex=pages.findIndex(page=>page.chapterIndex===chapterIndex);
  if(pageIndex<0)return;
  const button=document.createElement("button");button.type="button";
  button.className=chapter.s==="Part"?"contents-entry contents-part-entry":"contents-entry contents-chapter-entry";
  const name=document.createElement("span");name.textContent=chapter.h;
  const page=document.createElement("span");page.className="contents-page";page.textContent="Page "+(pageIndex+1);
  button.append(name,page);button.addEventListener("click",()=>{jumpToPage(pageIndex+1);closeContentsIndex()});host.appendChild(button);
 });
 if(!host.children.length){const empty=document.createElement("p");empty.className="contents-empty";empty.textContent="No chapter headings are available.";host.appendChild(empty)}
}
function jumpToPage(value){
 const page=Number(value);
 if(!Number.isInteger(page)||page<1||page>pages.length){$("#pageSearchStatus").textContent="Enter a page from 1 to "+pages.length+".";return false}
 idx=page-1;if(two)idx-=idx%2;render();$("#pageSearchStatus").textContent="Opened page "+page+".";return true;
}
function openContentsIndex(){$("#contentsPanel").classList.add("show");$("#contentsPanel").setAttribute("aria-hidden","false");renderContentsIndex();$("#contentsClose").focus()}
function closeContentsIndex(){$("#contentsPanel").classList.remove("show");$("#contentsPanel").setAttribute("aria-hidden","true")}
$("#contentsOpen").addEventListener("click",()=>{openContentsIndex();$("#panel").classList.remove("show");$("#gear").setAttribute("aria-expanded","false")});
$("#contentsClose").addEventListener("click",closeContentsIndex);
$("#contentsPanel").addEventListener("click",e=>{if(e.target===$("#contentsPanel"))closeContentsIndex()});
$("#pageSearchGo").addEventListener("click",()=>jumpToPage($("#pageSearch").value));
$("#pageSearch").addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();jumpToPage(e.currentTarget.value)}});
/* Layered original audio: soft interface taps and a textured paper-page sweep. */
let ac;
function audioContext(){ac=ac||new (window.AudioContext||window.webkitAudioContext)();if(ac.state==="suspended")ac.resume();return ac}
function clickSound(){
  if(!sound)return;try{
    const ctx=audioContext(),now=ctx.currentTime;
    [980,1480].forEach((hz,i)=>{const o=ctx.createOscillator(),g=ctx.createGain();o.type="sine";o.frequency.setValueAtTime(hz,now);o.frequency.exponentialRampToValueAtTime(hz*.72,now+.035);g.gain.setValueAtTime(i?.018:.026,now);g.gain.exponentialRampToValueAtTime(.0001,now+.055);o.connect(g);g.connect(ctx.destination);o.start(now);o.stop(now+.06)});
  }catch{}
}
function rustle(){
  if(!sound)return;
  const clip=$("#pageTurnAudio");
  if(clip){const playback=clip.cloneNode();playback.volume=.78;playback.play().catch(()=>{});return}
  try{
    const ctx=audioContext(),duration=.62,len=Math.floor(ctx.sampleRate*duration),buffer=ctx.createBuffer(1,len,ctx.sampleRate),data=buffer.getChannelData(0);
    for(let i=0;i<len;i++){const t=i/len,attack=Math.min(1,t/.09),decay=Math.pow(1-t,1.9),flutter=.62+.38*Math.sin(i/37)*Math.sin(i/113);data[i]=(Math.random()*2-1)*attack*decay*flutter}
    const source=ctx.createBufferSource();source.buffer=buffer;
    const high=ctx.createBiquadFilter();high.type="bandpass";high.frequency.setValueAtTime(1450,ctx.currentTime);high.frequency.exponentialRampToValueAtTime(3300,ctx.currentTime+.22);high.Q.value=.65;
    const low=ctx.createBiquadFilter();low.type="lowpass";low.frequency.value=950;
    const gain=ctx.createGain();gain.gain.setValueAtTime(.0001,ctx.currentTime);gain.gain.linearRampToValueAtTime(.17,ctx.currentTime+.08);gain.gain.exponentialRampToValueAtTime(.0001,ctx.currentTime+duration);
    source.connect(high);high.connect(low);low.connect(gain);gain.connect(ctx.destination);source.start();
    const thump=ctx.createOscillator(),tg=ctx.createGain();thump.type="triangle";thump.frequency.setValueAtTime(175,ctx.currentTime);thump.frequency.exponentialRampToValueAtTime(72,ctx.currentTime+.12);tg.gain.setValueAtTime(.035,ctx.currentTime);tg.gain.exponentialRampToValueAtTime(.0001,ctx.currentTime+.14);thump.connect(tg);tg.connect(ctx.destination);thump.start();thump.stop(ctx.currentTime+.15);
  }catch{}
}

/* page turn */
let busy=false;
function go(dir){
  const step=two?2:1,n=idx+dir*step;
  if(busy||n<0||n>pages.length-1)return;
  busy=true;
  const els=book.querySelectorAll(".pg");
  const target=dir>0?els[els.length-1]:els[0];
  const leaf=target.cloneNode(true);
  leaf.style.cssText=`position:absolute;top:0;left:${target.offsetLeft}px;z-index:5;backface-visibility:hidden;transform-origin:${dir>0?"left":"right"} center`;
  idx=n;render();book.appendChild(leaf);rustle();
  const reduce=matchMedia("(prefers-reduced-motion:reduce)").matches;
  const a=leaf.animate([{transform:"rotateY(0)",filter:"brightness(1)"},{transform:`rotateY(${dir>0?-100:100}deg)`,filter:"brightness(.65)"}],{duration:reduce?1:650,easing:"cubic-bezier(.5,0,.3,1)"});
  a.onfinish=()=>{leaf.remove();busy=false};
}
$("#nx").onclick=()=>go(1);$("#pv").onclick=()=>go(-1);
addEventListener("keydown",e=>{if(e.key==="ArrowRight")go(1);if(e.key==="ArrowLeft")go(-1)});
let sx=null;
book.addEventListener("touchstart",e=>sx=e.touches[0].clientX,{passive:true});
book.addEventListener("touchend",e=>{if(sx===null)return;const dx=e.changedTouches[0].clientX-sx;if(Math.abs(dx)>50)go(dx<0?1:-1);sx=null});

/* ribbon: one per book, like a real bookmark */
book.addEventListener("click",e=>{
  const b=e.target.closest(".rb");if(!b)return;
  const p=pages[+b.dataset.n];
  if(b.classList.contains("on")){bm=null}else{bm=p.w}
  st.set("vellora.bm."+id,bm);render();
});
$("#rj").onclick=()=>{if(bm===null)return;const n=pageIndexForWord(bm);const d=n>idx?1:-1;idx=n-(two?n%2:0);render();rustle()};

/* UI click feedback; page navigation adds its own paper sweep. */
document.addEventListener("click",e=>{if(e.target.closest("button,a,select,[role=button]"))clickSound()});
/* controls */
$("#ap").onclick=()=>{fs=Math.min(26,fs+2);st.set("vellora.fs",fs);applyPrefs();setup()};
$("#am").onclick=()=>{fs=Math.max(14,fs-2);st.set("vellora.fs",fs);applyPrefs();setup()};
$("#th").onchange=e=>{st.set("vellora.theme",e.target.value);applyPrefs();setup()};
$("#snd").onclick=()=>{sound=!sound;st.set("vellora.sound",sound);applyPrefs()};
let rt;addEventListener("resize",()=>{clearTimeout(rt);rt=setTimeout(()=>{if((innerWidth>=900)!==two||true)setup()},250)});

/* PDF: prints a clean book layout (cover, chapters, page numbers, faint VELLORA mark) in the chosen theme. Choose "Save as PDF" in the print dialog. */
$("#pdf").onclick=()=>{
  $("#print").innerHTML=`<div class="wmf">VELLORA</div><div class="cov"><h1>${safeText(title)}</h1><small>${safeText(genre.toUpperCase())}</small><small style="margin-top:8mm">${safeText(author)}</small><small style="margin-top:30mm">VELLORA</small></div>`+
   chapters.map(c=>`<h2>${c.h}</h2><div class="sub">${c.s||""}</div><div class="orn">&#10086;</div>`+c.p.map((t,i)=>`<p class="${i===0?"first":""}">${t}</p>`).join("")).join("");
  print();
};

if(previewMode){
  const back=$(".back");back.href="admin.html";back.textContent="‹ Return to Admin Hub";
  back.addEventListener("click",event=>{
    if(window.opener&&!window.opener.closed){
      event.preventDefault();
      try{window.opener.focus()}catch{}
      try{window.close()}catch{back.textContent="Close this preview tab to return to your draft"}
    }
  });
  const flag=document.createElement("span");flag.className="preview-flag";flag.textContent="DRAFT PREVIEW";flag.setAttribute("aria-label","Unpublished draft preview");$("#top").appendChild(flag);
  document.title="Reader preview – VELLORA";
  $("#ttl").textContent="Waiting for draft…";
  $("#book").innerHTML='<div class="pg" style="display:flex;flex-direction:column;justify-content:center;text-align:center"><h2>Preparing your preview</h2><p>Your draft will appear here shortly.</p></div>';
  window.addEventListener("message",async event=>{
    if(event.origin!==location.origin||event.source!==window.opener||event.data?.type!=="vellora-reader-preview-data")return;
    const data=event.data.payload||{};
    title=String(data.title||"Untitled story");author=String(data.author||"VELLORA Editions");genre=String(data.genre||"VELLORA EDITIONS");
    chapters=parseManuscript(String(data.manuscript||""));id="admin-draft-preview";pos=0;bm=null;
    $("#ttl").textContent=title+" · "+author;document.title=title+" – VELLORA Reader Preview";
    await (document.fonts?document.fonts.ready:Promise.resolve());setup();
  });
  if(window.opener)window.opener.postMessage({type:"vellora-reader-preview-ready"},location.origin);
  else $("#book").innerHTML='<div class="pg" style="display:flex;flex-direction:column;justify-content:center;text-align:center"><h2>Preview connection unavailable</h2><p>Open this preview from the VELLORA Admin Hub.</p></div>';
}else loadStory();

/* settings panel */
(function(){
  const panel=$("#panel"),gear=$("#gear");
  const mark=()=>document.querySelectorAll("[data-theme-pick]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.themePick===root.dataset.theme));
  mark();
  const set=o=>{panel.classList.toggle("show",o);gear.setAttribute("aria-expanded",o)};
  gear.onclick=()=>set(!panel.classList.contains("show"));
  panel.addEventListener("click",e=>{const t=e.target.closest("[data-theme-pick]");if(!t)return;const th=$("#th");th.value=t.dataset.themePick;th.dispatchEvent(new Event("change"));mark()});
  document.addEventListener("click",e=>{const p=e.composedPath();if(!p.includes(panel)&&!p.includes(gear))set(false)});
  document.addEventListener("keydown",e=>{if(e.key==="Escape")set(false)});
})();
</script>
</body>
